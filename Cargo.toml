[workspace]
members = ["server/renderer", "server/viewer", "server/runtime", "common"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/xiaoyxue/chr"

[workspace.dependencies]
chr-renderer = { path = "server/renderer" }
chr-common = { path = "common" }
wgpu = "30"
pollster = "0.4"
log = "0.4"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

[workspace.metadata.crane]
name = "chr"
