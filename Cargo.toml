[workspace]
members = ["server/renderer", "server/viewer", "server/runtime", "common", "common/shm", "monitor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/xiaoyxue/chr"

[workspace.dependencies]
chr-renderer = { path = "server/renderer" }
chr-common = { path = "common" }
chr-shm = { path = "common/shm" }
wgpu = "30"
pollster = "0.4"
log = "0.4"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
exr = { version = "1.74", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer = { version = "0.25", features = ["v1_22"] }
gstreamer-app = { version = "0.25", features = ["v1_22"] }
gstreamer-video = { version = "0.25", features = ["v1_22"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

[workspace.metadata.crane]
name = "chr"
