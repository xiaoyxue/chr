[package]
name = "chr-runtime"
default-run = "chr-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "chr runtime: the chr-server render server, the chr-renderer-cli renderer, the chr-tracking-sim simulator and their shared program logic"

[lints]
workspace = true

[[bin]]
name = "chr-server"
path = "src/main.rs"

[[bin]]
name = "chr-renderer-cli"
path = "src/renderer_cli.rs"

[[bin]]
name = "chr-tracking-sim"
path = "src/tracking_sim.rs"

[features]
gstreamer-media = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
chr-renderer.workspace = true
chr-common.workspace = true
chr-shm.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image.workspace = true
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await-macro"] }
