[package]
name = "chr-runtime"
default-run = "chr-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "chr runtime: the chr-server render server, its chr-renderer-cli render worker and chr-tracking-sim-cli tracking worker stand-in, the chr-sdi-sim SDI capture simulator and their shared program logic"

[lints]
workspace = true

[[bin]]
name = "chr-server"
path = "src/main.rs"

[[bin]]
name = "chr-renderer-cli"
path = "src/renderer_cli.rs"

[[bin]]
name = "chr-sdi-sim"
path = "src/sdi_sim.rs"

[[bin]]
name = "chr-tracking-sim-cli"
path = "src/tracking_sim_cli.rs"

[features]
gstreamer-media = ["dep:gstreamer-video"]

[dependencies]
chr-renderer.workspace = true
chr-tracker.workspace = true
chr-common.workspace = true
chr-shm.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Bit-exact f64 parsing: tracking Ti crosses JSON (VchaoFrame) unchanged.
serde_json = { version = "1", features = ["float_roundtrip"] }
image.workspace = true
gstreamer.workspace = true
gstreamer-allocators.workspace = true
gstreamer-app.workspace = true
gstreamer-video = { workspace = true, optional = true }
sha2 = "0.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await-macro"] }
