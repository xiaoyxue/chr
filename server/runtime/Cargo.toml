[package]
name = "chr-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Headless mock render server: rotating triangle, local IPC control, and WebRTC preview"

[lints]
workspace = true

[dependencies]
chr-renderer.workspace = true
chr-common.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
env_logger = "0.11"
webrtc = "0.21"
# Sans-I/O core of `webrtc`; its media and codec types are not re-exported.
rtc = "0.21"
async-trait = "0.1"
thiserror = "2"
openh264 = "0.9"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
