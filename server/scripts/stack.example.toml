# Copy to output/stack/stack.toml (ignored by Git) and edit; used by
# `uv run server/scripts/stack.py start|stop|restart|status`.
# Relative paths are from the repository root.

# calibrated-video-v1 manifest and its clip: the simulated tracked camera.
scene = "/path/to/clip-manifest.json"
video = "/path/to/clip.mp4"

# Optional render description drawn instead of the manifest's scene, and the
# directory clients may load description packages from (description.load).
# description = "output/description/start.json"
# asset_root = "/path/to/packages"

# "worker": chr-server hands every frame to its tracking worker over vchao's VchaoFrame
# unixfd contract (server/docs/tracking-worker.md). "external": chr-sdi-sim --send-cameras sends
# the cameras over tracking.frame.
tracking = "worker"
# The tracking worker executable; empty: chr-tracking-sim-cli, which replays the
# manifest's recorded Ti through the manifest's or description's lens. Any other
# worker's Ti is rendered without a lens (vchao estimates against the distorted image).
# vchao's pitch-analysis (build: docs/operations.md#run-with-vchao-tracking) on a
# non-NixOS host goes through with-cuda-driver.sh; on NixOS name it directly.
# tracking_cli = "server/scripts/with-cuda-driver.sh"
# Its arguments; chr-server adds --stream-id and the two sockets, and replaces
# "{stream_id}" with each worker session's stream ID (a restarted worker is a new stream).
# tracking_worker_args = ["output/vchao/pitch-analysis/bin/pitch-analysis",
#     "--asset-manifest", "/path/to/map/manifest.json",
#     "--batch-frames", "8", "--estimate-every", "4", "--interpolation", "logh",
#     "--overload-ms", "500", "--ledger", "/path/to/runs/{stream_id}.arrow"]
# Station optical centre of every camera: world metres, negative Z up. Default: the
# reference camera of the description or manifest.
# tracking_centre = [14.52857216404143, 60.620266710663365, -9.91514362632655]
# How long a frame waits for its camera, at most 1500 ms. With a tracking worker every
# frame leaves exactly this long after capture: the program delay. pitch-analysis may
# hold a frame up to its 500 ms overload threshold, so give it about 800.
# tracking_wait_ms = 800

# Program output size: even, up to 4096x2160 (DCI 4K; 4K UHD is 3840x2160), with
# the camera's aspect ratio. Use the camera's own size to render natively: onsite
# that is "1920x1080". chr-monitor scales its preview down to at most 1920x1080.
size = "1280x720"
# Socket, input ring and program tap; kept between runs.
# dir = "/run/user/1000/chr-stack"
# Wrap GPU processes with nixGLNvidia (non-NixOS NVIDIA hosts).
nixgl = true

# chr-monitor SRT listener; use an interface address to reach it from other hosts.
srt = "127.0.0.1:9001"
server_ws = "127.0.0.1:8787"
monitor_ws = "127.0.0.1:8789"
# First of four ICE-TCP ports for WebRTC viewers behind an SSH forward.
webrtc_tcp = "127.0.0.1:8790"

# Set a port to 0 to leave that component out.
srt_relay_port = 0         # SRT -> TCP relay on 127.0.0.1, for ffplay through SSH
pitch_studio_port = 4173   # built pitch-studio under vite preview (send to renderer)
# Where pitch-studio stores matches, placements, sessions and uploaded materials and
# ZIPs (the "studio store"). Put it inside asset_root so chr-server can read the
# uploads; without it the studio uses the repository's ignored output/pitch-studio.
# studio_data_dir = "/path/to/packages/studio"
monitor_page_port = 5173   # read-only program monitor page
