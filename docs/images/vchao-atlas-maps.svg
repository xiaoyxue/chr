<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
<style>
text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#222}
.s{font-size:12px} .t{font-size:17px;font-weight:bold} .m{font-style:italic}
.ray{stroke:#999;stroke-width:1.2}
.ground{stroke:#2e7d32;stroke-width:4}
.sig{stroke:#1565c0;stroke-width:4} .sigx{stroke:#1565c0;stroke-width:2;stroke-dasharray:6 5}
.fi{stroke:#e65100;stroke-width:4}
.alt{stroke:#7b1fa2;stroke-width:3}
.arr{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="860" height="440" fill="#fff"/>
<rect x="30" y="140" width="190" height="124" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<line x1="125" y1="140" x2="125" y2="264" stroke="#2e7d32"/><circle cx="125" cy="202" r="18" fill="none" stroke="#2e7d32"/>
<rect x="30" y="176" width="30" height="52" fill="none" stroke="#2e7d32"/><rect x="190" y="176" width="30" height="52" fill="none" stroke="#2e7d32"/>
<text x="30" y="125" class="t">pitch ground Π<tspan class="s" baseline-shift="sub">0</tspan></text>
<text x="30" y="288" class="s">top view, (X, Y, 1) in metres</text>
<text x="30" y="304" class="s">fixed standard model</text>
<rect x="330" y="120" width="210" height="164" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="370" y="160" width="130" height="84" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
<circle cx="352" cy="140" r="4" fill="#455a64"/>
<circle cx="520" cy="150" r="4" fill="#455a64"/>
<circle cx="395" cy="190" r="4" fill="#455a64"/>
<circle cx="470" cy="205" r="4" fill="#455a64"/>
<circle cx="430" cy="260" r="4" fill="#455a64"/>
<circle cx="510" cy="270" r="4" fill="#455a64"/>
<circle cx="350" cy="250" r="4" fill="#455a64"/>
<text x="330" y="105" class="t">reference film Σ</text>
<text x="374" y="178" class="s">frame r itself</text>
<text x="330" y="304" class="s">SNC of frame r, extended (dashed)</text>
<text x="330" y="320" class="s">dots: landmarks q_k (rays)</text>
<rect x="660" y="40" width="170" height="96" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="672" y="94">film of frame <tspan class="m">i</tspan></text>
<rect x="660" y="268" width="170" height="96" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="672" y="322">film of frame <tspan class="m">j</tspan></text>
<text x="660" y="384" class="s">SNC, finite, has pixels</text>
<path class="arr" d="M222,202 L326,202"/>
<text x="236" y="192" class="m">T<tspan class="s" baseline-shift="sub">ref</tspan></text><text x="232" y="224" class="s">= T_r (V_r = I)</text>
<path class="arr" d="M542,170 L656,100"/>
<text x="580" y="120" class="m">V<tspan class="s" baseline-shift="sub">i</tspan></text>
<path class="arr" d="M542,236 L656,304"/>
<text x="580" y="300" class="m">V<tspan class="s" baseline-shift="sub">j</tspan></text>
<path class="arr" d="M745,138 L745,264"/>
<text x="752" y="190" class="m">H<tspan class="s" baseline-shift="sub">j←i</tspan></text>
<text x="752" y="212" class="m">= V<tspan class="s" baseline-shift="sub">j</tspan> V<tspan class="s" baseline-shift="sub">i</tspan><tspan class="s" baseline-shift="super">−1</tspan></text>
<text x="752" y="234" class="m">= T<tspan class="s" baseline-shift="sub">j</tspan> T<tspan class="s" baseline-shift="sub">i</tspan><tspan class="s" baseline-shift="super">−1</tspan></text>
<path class="arr" d="M210,138 C240,30 520,20 656,70"/>
<text x="300" y="40" class="m">T<tspan class="s" baseline-shift="sub">i</tspan> = V<tspan class="s" baseline-shift="sub">i</tspan> T<tspan class="s" baseline-shift="sub">ref</tspan></text>
<text x="30" y="420" class="s">One index = one film. Two indices = film to film. Σ is a film like the others; it is only the one every frame is recorded against.</text>
</svg>