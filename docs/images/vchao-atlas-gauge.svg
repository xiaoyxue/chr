<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<style>
text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#222}
.s{font-size:12px} .t{font-size:17px;font-weight:bold} .m{font-style:italic}
.ray{stroke:#999;stroke-width:1.2}
.ground{stroke:#2e7d32;stroke-width:4}
.sig{stroke:#1565c0;stroke-width:4} .sigx{stroke:#1565c0;stroke-width:2;stroke-dasharray:6 5}
.fi{stroke:#e65100;stroke-width:4}
.alt{stroke:#7b1fa2;stroke-width:3}
.arr{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style>
