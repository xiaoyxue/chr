<text x="341" y="272" class="t">Σ</text>
<line class="alt" x1="384.2" y1="79.4" x2="411.0" y2="227.0"/>
<text x="411" y="154" class="t">Σ′</text>
<line class="fi" x1="204.1" y1="80.4" x2="346.4" y2="127.8"/>
<text x="274" y="88" class="t">Σ″</text>
<circle cx="250" cy="180" r="7" fill="#000"/><text x="226" y="210" class="m">C</text>
<text x="520" y="60">Any film at C that does not pass through C</text>
<text x="520" y="82">can be the reference: choose its orientation R′</text>
<text x="520" y="104">(3 DOF) and intrinsics K′ (5 DOF), i.e. any</text>
<text x="520" y="126">M = K′R′ in PGL(3) (8 DOF).</text>
<text x="520" y="148"></text>
<text x="520" y="170">Changing the reference film by M:</text>
<text x="520" y="192">  V_i′ = V_i M,   q_k′ = M⁻¹ q_k,</text>
<text x="520" y="214">  T_ref′ = M⁻¹ T_ref.</text>
<text x="520" y="236"></text>
<text x="520" y="258">Unchanged: T_i = V_i T_ref,</text>
<text x="520" y="280">  H_j←i = V_j V_i⁻¹,  x_ik ~ V_i q_k.</text>
