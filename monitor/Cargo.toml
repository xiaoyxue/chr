[package]
name = "chr-monitor"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Program monitor: encodes chr-server's transmitted SDI output for WebRTC and SRT viewers"

[lints]
workspace = true

[features]
gstreamer-media = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
chr-common.workspace = true
chr-shm.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
env_logger = "0.11"
webrtc = "0.21"
# Sans-I/O core of `webrtc`; its media and codec types are not re-exported.
rtc = "0.21"
async-trait = "0.1"
thiserror = "2"
openh264 = "0.9"
bytes = "1"
serde_json = "1"
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
